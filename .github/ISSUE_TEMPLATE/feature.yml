name: Предложить сценарий / помощь
description: Для предпринимателей, тестировщиков и технических партнёров
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Пожалуйста, не публикуйте персональные данные, токены, внутренние адреса и конфиденциальные сведения о клиентах. CRM +++ — закрытый прототип, не готовый SaaS.
  - type: dropdown
    id: topic
    attributes:
      label: Тема обращения
      options:
        - Сценарий бизнеса
        - Обратная связь по интерфейсу
        - Готовность обсудить будущий пилот
        - Техническая помощь / партнёрство
        - Другое
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Проблема или предложение
      description: Что именно стоит улучшить и кому это полезно? Только обезличенные примеры.
      placeholder: В нашей работе обращения приходят в нескольких каналах, а менеджер теряет историю разговора...
    validations:
      required: true
  - type: textarea
    id: benefit
    attributes:
      label: Ожидаемый результат и возможное участие
      description: Опиши результат, способ помощи или желание обсудить пилот, не оставляя приватных контактов.
    validations:
      required: false
